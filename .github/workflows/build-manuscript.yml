name: Build manuscript PDF
on:
  push: { branches: [main] }
  workflow_dispatch:
permissions: { contents: write }
concurrency: { group: build-manuscript, cancel-in-progress: true }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: xu-cheng/latex-action@v3
        with: { working_directory: manuscript, root_file: main.tex, latexmk_use_xelatex: false }
      - run: |
          mkdir -p docs/manuscript
          cp manuscript/main.pdf docs/manuscript/glycome_cytoskeleton_manuscript.pdf
      - uses: stefanzweifel/git-auto-commit-action@v5
        with: { commit_message: "CI: rebuild manuscript PDF [skip ci]", file_pattern: "docs/manuscript/*.pdf" }
